<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 950" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #050505; }
      .border { stroke: #00ff41; stroke-width: 2; fill: none; }
      .border-dashed { stroke: #00ff41; stroke-width: 2; fill: none; stroke-dasharray: 4 4; }
      .text { font-family: 'Courier New', Courier, monospace; fill: #00ff41; font-size: 15px; }
      .text-small { font-family: 'Courier New', Courier, monospace; fill: #00aa22; font-size: 13px; }
      .title { font-family: 'Courier New', Courier, monospace; fill: #00ff41; font-size: 36px; font-weight: bold; }
      .highlight { fill: #ffffff; text-shadow: 0 0 5px #00ff41; font-weight: bold; }
      
      /* CRT scanline pattern overlay */
      .scanlines { fill: url(#scanlines); opacity: 0.2; pointer-events: none; }
      
      /* Pulsing glow */
      .glow { animation: pulse 2s infinite alternate; }
      @keyframes pulse {
        0% { filter: drop-shadow(0 0 2px #00ff41); }
        100% { filter: drop-shadow(0 0 8px #00ff41); }
      }
      
      /* Typing effect base */
      .type-mask { clip-path: inset(0 100% 0 0); }
      
      /* Sequential typing animations */
      .type1 { animation: type 0.8s steps(40, end) forwards; animation-delay: 0.5s; }
      .type2 { animation: type 0.8s steps(40, end) forwards; animation-delay: 1.5s; }
      .type3 { animation: type 0.8s steps(40, end) forwards; animation-delay: 2.3s; }
      .type4 { animation: type 0.8s steps(40, end) forwards; animation-delay: 3.1s; }
      
      /* Batch fade ins for panels */
      .fade-in { opacity: 0; animation: fadeIn 0.5s forwards; }
      .delay-4s { animation-delay: 4.2s; }
      .delay-5s { animation-delay: 5.2s; }
      .delay-6s { animation-delay: 6.2s; }
      
      @keyframes type { to { clip-path: inset(0 0 0 0); } }
      @keyframes fadeIn { to { opacity: 1; } }
      
      /* Blinking cursor */
      .cursor { animation: blink 1s infinite; }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      
      /* Glitch effect on name */
      .glitch1 { animation: glitch-anim-1 2.5s infinite linear alternate-reverse; fill: #ff003c; }
      .glitch2 { animation: glitch-anim-2 3s infinite linear alternate-reverse; fill: #00e5ff; }
      
      @keyframes glitch-anim-1 {
        0% { clip-path: inset(10% 0 80% 0); transform: translate(-2px, 1px); }
        20% { clip-path: inset(40% 0 40% 0); transform: translate(2px, -1px); }
        40% { clip-path: inset(80% 0 10% 0); transform: translate(-2px, 2px); }
        60% { clip-path: inset(20% 0 60% 0); transform: translate(2px, -2px); }
        80% { clip-path: inset(50% 0 30% 0); transform: translate(-1px, 1px); }
        100% { clip-path: inset(10% 0 80% 0); transform: translate(1px, -1px); }
      }
      @keyframes glitch-anim-2 {
        0% { clip-path: inset(20% 0 60% 0); transform: translate(2px, -1px); }
        20% { clip-path: inset(60% 0 20% 0); transform: translate(-2px, 2px); }
        40% { clip-path: inset(30% 0 50% 0); transform: translate(2px, 1px); }
        60% { clip-path: inset(80% 0 10% 0); transform: translate(-1px, -2px); }
        80% { clip-path: inset(10% 0 70% 0); transform: translate(2px, 1px); }
        100% { clip-path: inset(40% 0 40% 0); transform: translate(-2px, -1px); }
      }
      
      /* Floating objects */
      .float { animation: float 4s ease-in-out infinite; }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
      }
      
      /* Progress bar animation */
      .progress-bar { clip-path: inset(0 100% 0 0); animation: type 1.5s ease-out forwards; animation-delay: 5.5s; }
      
      .header-bar { fill: #00ff41; opacity: 0.2; }
    </style>
    
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="4" y2="0" stroke="#000" stroke-width="2" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect class="bg" width="100%" height="100%" />
  
  <!-- Outer Terminal Window -->
  <rect x="10" y="10" width="880" height="920" rx="8" class="border glow" />
  
  <!-- Terminal Header -->
  <rect x="10" y="10" width="880" height="30" rx="8" class="header-bar" />
  <rect x="10" y="30" width="880" height="10" fill="#00ff41" opacity="0.2" /> <!-- flatten bottom corners of header -->
  <circle cx="25" cy="25" r="6" fill="#ff5f56" />
  <circle cx="45" cy="25" r="6" fill="#ffbd2e" />
  <circle cx="65" cy="25" r="6" fill="#27c93f" />
  <text x="350" y="27" class="text" fill="#000" font-weight="bold">vmf-os v9.9.9 - SYS_TERMINAL</text>
  
  <!-- Section 1: Booting Sequence / Whoami -->
  <g class="type-mask type1">
    <text x="30" y="70" class="text">root@vicenzo-mainframe:~# ./init_profile.sh</text>
  </g>
  <g class="type-mask type2">
    <text x="30" y="95" class="text">Initializing identity module...................... <tspan class="highlight">[OK]</tspan></text>
  </g>
  <g class="type-mask type3">
    <text x="30" y="120" class="text">Loading tech_stack.dll &amp; repositories............. <tspan class="highlight">[OK]</tspan></text>
  </g>
  <g class="type-mask type4">
    <text x="30" y="145" class="text">Bypassing mainframe security protocols............ <tspan class="highlight">[OK]</tspan></text>
  </g>
  
  <g class="fade-in delay-4s">
    <text x="30" y="185" class="text">root@vicenzo-mainframe:~# whoami</text>
    
    <!-- Glitched Ascii Name -->
    <text x="30" y="225" class="title glitch1">VICENZO_MF</text>
    <text x="30" y="225" class="title glitch2">VICENZO_MF</text>
    <text x="30" y="225" class="title highlight">VICENZO_MF</text>
    
    <text x="30" y="255" class="text">ROLE     : Full Stack Web Developer &amp; Software Engineer</text>
    <text x="30" y="275" class="text">LOCATION : PUCRS (7th Semester) &amp; SenacRS</text>
    <text x="30" y="295" class="text">STATUS   : Turning caffeine into highly scalable code <tspan class="cursor">█</tspan></text>
  </g>
  
  <!-- Panel 1: TECH STACK -->
  <g class="fade-in delay-5s">
    <rect x="30" y="330" width="400" height="470" class="border" />
    <text x="40" y="350" class="text highlight">[ SYSTEM ARCHITECTURE / TECH STACK ]</text>
    
    <text x="45" y="410" class="text">FRONTEND  ::</text>
    <rect x="150" y="400" width="250" height="10" fill="#222" />
    <rect x="150" y="400" width="225" height="10" fill="#00ff41" class="progress-bar glow" />
    <text x="150" y="425" class="text-small">React, TypeScript, TailwindCSS</text>
    
    <text x="45" y="490" class="text">BACKEND   ::</text>
    <rect x="150" y="480" width="250" height="10" fill="#222" />
    <rect x="150" y="480" width="240" height="10" fill="#00ff41" class="progress-bar glow" />
    <text x="150" y="505" class="text-small">NestJS, FastAPI, Python, NodeJS</text>
    
    <text x="45" y="570" class="text">DATABASE  ::</text>
    <rect x="150" y="560" width="250" height="10" fill="#222" />
    <rect x="150" y="560" width="210" height="10" fill="#00ff41" class="progress-bar glow" />
    <text x="150" y="585" class="text-small">PostgreSQL, Prisma, Supabase</text>

    <text x="45" y="650" class="text">DEVOPS    ::</text>
    <rect x="150" y="640" width="250" height="10" fill="#222" />
    <rect x="150" y="640" width="180" height="10" fill="#00ff41" class="progress-bar glow" />
    <text x="150" y="665" class="text-small">Docker, OpenAPI, Git Actions</text>
  </g>
  
  <!-- Panel 2: EXPERIENCES & PROJECTS -->
  <g class="fade-in delay-6s">
    <rect x="450" y="330" width="420" height="470" class="border" />
    <text x="460" y="350" class="text highlight">[ DIRECTORY TREE / EXPERIENCE &amp; OS ]</text>
    
    <!-- Experience Summary -->
    <text x="460" y="380" class="text">|-- Experience_Vault/</text>
    <text x="460" y="400" class="text-small">|   |-- <tspan fill="#00e5ff">Oryza_Labs/</tspan>    [Full Stack Web &amp; Mobile]</text>
    <text x="460" y="420" class="text-small">|   |-- <tspan fill="#00e5ff">PainelConstru/</tspan> [Marketplace &amp; AI Chatbot]</text>
    <text x="460" y="440" class="text-small">|   |-- <tspan fill="#00e5ff">Faladoc.ai/</tspan>    [Medical Voice AI Records]</text>
    
    <!-- Open Source Highlights -->
    <text x="460" y="480" class="text highlight">|-- MY_OPEN_SOURCE/ <tspan fill="#ff003c" class="glitch1" font-size="12">*** NEW ***</tspan></text>
    
    <text x="460" y="510" class="text">|   |-- <tspan fill="#ff003c" font-weight="bold" class="glow">&gt; KATA</tspan></text>
    <text x="460" y="530" class="text-small">|   |   |-- Architecture templates &amp; challenges</text>

    <text x="460" y="560" class="text">|   |-- <tspan fill="#00e5ff" font-weight="bold" class="glow">&gt; RELAY</tspan></text>
    <text x="460" y="580" class="text-small">|   |   |-- Event-driven data synchronization</text>

    <text x="460" y="610" class="text">|   |-- <tspan fill="#ffbd2e" font-weight="bold" class="glow">&gt; PAGEBOY</tspan></text>
    <text x="460" y="630" class="text-small">|   |   |-- Automated pagination &amp; data utility</text>
    
    <!-- External OSS Contributions -->
    <text x="460" y="670" class="text highlight">|-- CONTRIBUTIONS/</text>
    
    <text x="460" y="700" class="text">|   |-- <tspan fill="#9ece6a" font-weight="bold" class="glow">&gt; MEDUSAJS</tspan></text>
    <text x="460" y="720" class="text-small">|   |   |-- Open source headless commerce</text>
    
    <text x="460" y="750" class="text">|   |-- <tspan fill="#e0af68" font-weight="bold" class="glow">&gt; HOPPSCOTCH</tspan></text>
    <text x="460" y="770" class="text-small">|   |   |-- Open source API development ecosystem</text>
  </g>

  <!-- Panel 3: Stats / Footer -->
  <g class="fade-in delay-6s float">
    <rect x="30" y="820" width="840" height="85" class="border-dashed" />
    <text x="50" y="850" class="text">SYS_STATS: <tspan class="highlight">Level 99</tspan> | CONTRIBUTIONS: ACTIVE | AI_INTEGRATION_PROTOCOLS: ENABLED</text>
    <text x="50" y="875" class="text-small" fill="#00aa22">&gt; "A complex system that works is invariably found to have evolved </text>
    <text x="50" y="890" class="text-small" fill="#00aa22">  from a simple system that worked." - John Gall</text>
  </g>
  
  <rect class="scanlines" width="100%" height="100%" />
</svg>
